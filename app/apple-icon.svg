<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="나의 책장">
  <!--
    아이폰 홈 화면용 — app/icon.svg와 같은 그림이되 모서리를 둥글게 하지 않는다.
    iOS가 알아서 긎기 때문에 우리까지 긎으면 모서리가 이중으로 파인다.

    앱 아이콘 — 나무 선반에 꽂힌 책 세 권
    글자를 넣지 않는다. 작게 줄면 읽히지 않고, 이름은 아이콘 아래 따로 붙는다.
    (참고 글: 토스도 런처 아이콘에서 글자를 빼고 심볼만 남겼다)

    앱과 같은 미색 바탕 · 파스텔 책등 · 나무 선반.
  -->
  <rect width="64" height="64" rx="0" fill="#F8F3E9" />
  <g>
    <rect x="15" y="17" width="9" height="30" rx="2" fill="#AFD6F0" />
    <rect x="27.5" y="13" width="9" height="34" rx="2" fill="#F6B8C6" />
    <rect x="40" y="20" width="9" height="27" rx="2" fill="#D7E4A6" />
  </g>
  <!-- 나무 선반 -->
  <rect x="12" y="47" width="40" height="4" rx="1.5" fill="#C99A6A" />
  <rect x="12" y="51" width="40" height="2" rx="1" fill="#A87C4C" />
</svg>
